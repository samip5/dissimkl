name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-aarch64
            os: macos-26
            target: aarch64-apple-darwin
          - name: macos-intel
            os: macos-26-intel
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # A tag build is stamped with the tag; a workflow_dispatch run off a
      # branch passes an empty string, which build.rs treats as "not a release"
      # and stamps with the commit instead.
      - name: Build
        env:
          DISSIMKL_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Every target in the matrix builds natively, so the fresh binary can be
      # asked what version it thinks it is. --version returns before any config
      # or tray setup, so this is safe on a headless runner.
      - name: Verify stamped version
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/dissimkl"
          # Not `[ … ] && bin=…`: a false test would be the step's last exit
          # status and `bash -e` would abort the job on every non-Windows runner.
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin="$bin.exe"
          fi
          stamped="$("$bin" --version)"
          echo "$stamped"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            expected="dissimkl ${GITHUB_REF_NAME#v}"
            if [ "$stamped" != "$expected" ]; then
              echo "::error::expected '$expected', got '$stamped'"
              exit 1
            fi
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/dissimkl"
          archive="dissimkl-${{ matrix.name }}.tar.gz"
          tar -czf "$archive" -C "$(dirname "$bin")" "$(basename "$bin")"
          echo "ASSET=$archive" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/dissimkl.exe"
          $archive = "dissimkl-${{ matrix.name }}.zip"
          Compress-Archive -Path $bin -DestinationPath $archive
          "ASSET=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dissimkl-${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
